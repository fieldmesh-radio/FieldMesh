# FieldMesh: build the release files and put them on a draft release.
#
# Actions -> "FieldMesh Release" -> Run workflow, enter the version (e.g. v2.2.0).
# The workflow builds the prebuilt devices from the selected branch (normally main),
# names the files <env>_FieldMesh<version>.zip / _full.bin / _update.bin and creates a
# DRAFT release with tag <version> on that commit. Paste the release notes into the
# draft and publish it - the tag is created on publish.
# With "create_release" unticked it only builds; the files are under the run's artifacts.
# The firmware shows the entered version (FIELDMESH_VERSION, see FieldMeshVersion.h).
#
# Adding a device to a published release (it was tested on that version's code):
# enter the version, the device(s) and tick "attach_to_existing". The files are then
# built from the release's tag and added to the existing release; files that are already
# there are never replaced. Afterwards run "FieldMesh Flasher" so the web flasher offers
# the new files.
#
# Only devices tested on hardware get prebuilt files (see README).
name: FieldMesh Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. v2.2.0'
        required: true
        type: string
      devices:
        description: 'Only these devices (build environments, comma-separated). Empty = all'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Create a draft release with the files'
        required: true
        type: boolean
        default: true
      attach_to_existing:
        description: 'Add the files to the existing release of this version (built from its tag)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # check the inputs and pick the devices to build
  prepare:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.pick.outputs.envs }}
    steps:
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Version must look like v2.2.0 or v2.2.1, got '$VERSION'"
            exit 1
          fi

      - name: Check release
        if: ${{ inputs.attach_to_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            echo "There is no release '$VERSION' to add files to"
            exit 1
          fi

      # every device with prebuilt files - add a device here once it was tested on hardware
      - name: Pick devices
        id: pick
        env:
          ONLY: ${{ inputs.devices }}
        run: |
          ALL="ThinkNode_M1_companion_radio_ble
          WioTrackerL1_companion_radio_ble
          t1000e_companion_radio_ble
          LilyGo_T-Echo_companion_radio_ble
          MeshTracker_X1_companion_radio_ble
          Station_G2_fieldmesh_repeater
          heltec_v4_fieldmesh_repeater"
          if [ -z "$ONLY" ]; then
            PICK="$ALL"
          else
            PICK=$(echo "$ONLY" | tr ',' ' ')
          fi
          for e in $PICK; do
            if ! printf '%s\n' $ALL | grep -qx "$e"; then
              echo "Unknown device '$e'. Known devices:"
              printf '  %s\n' $ALL
              exit 1
            fi
          done
          ENVS=$(printf '%s\n' $PICK | jq -R . | jq -cs .)
          echo "Devices: $ENVS"
          echo "envs=$ENVS" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        environment: ${{ fromJSON(needs.prepare.outputs.envs) }}

    steps:
      # attaching to a release: build the code of its tag, not of the selected branch
      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.attach_to_existing && inputs.version || '' }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      # FieldMesh version and today's date go into the firmware; every later pio step
      # sees the same flags, so mergebin does not rebuild without them
      - name: Version flags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "PLATFORMIO_BUILD_FLAGS=-DFIELDMESH_VERSION='\"${VERSION}\"' -DFIRMWARE_BUILD_DATE='\"$(LC_ALL=C date -u '+%d %b %Y')\"'" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.environment }}
        run: |
          echo "Build flags: $PLATFORMIO_BUILD_FLAGS"
          pio run -e ${{ matrix.environment }}

      - name: Collect files
        env:
          ENV_NAME: ${{ matrix.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p out
          BASE="${ENV_NAME}_FieldMesh${VERSION}"
          if [ -f ".pio/build/${ENV_NAME}/firmware.zip" ]; then
            # nRF52: DFU zip for the web flasher
            cp ".pio/build/${ENV_NAME}/firmware.zip" "out/${BASE}.zip"
          else
            # ESP32: full image (0x0) and app-only update
            pio run -e "${ENV_NAME}" -t mergebin
            cp ".pio/build/${ENV_NAME}/firmware-merged.bin" "out/${BASE}_full.bin"
            cp ".pio/build/${ENV_NAME}/firmware.bin" "out/${BASE}_update.bin"
          fi
          ls -la out

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.environment }}
          path: out

  release:
    needs: build
    if: ${{ inputs.create_release && !inputs.attach_to_existing }}
    runs-on: ubuntu-latest

    steps:
      - name: Download files
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      # Release titles are "FieldMesh X.Y.Z" without the "v" of the tag
      - name: Release title
        id: title
        env:
          VERSION: ${{ inputs.version }}
        run: echo "name=FieldMesh ${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.title.outputs.name }}
          body: "Paste the release notes here."
          draft: true
          files: out/*

  # add the files to a published release; no --clobber: an existing file is never replaced
  attach:
    needs: build
    if: ${{ inputs.attach_to_existing }}
    runs-on: ubuntu-latest

    steps:
      - name: Download files
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Add files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ls -la out
          gh release upload "$VERSION" out/* --repo "$GITHUB_REPOSITORY"
          echo "Added to $VERSION. Now run 'FieldMesh Flasher' so the web flasher offers the new files."
